services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8999:80"
