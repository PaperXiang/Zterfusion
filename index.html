<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zterfusion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="config-screen" class="screen active">
        <div class="pixel-container">
            <h1 class="pixel-title">ZTERFUSION</h1>
            <div class="config-section">
                <h2 class="pixel-subtitle">MODE</h2>
                <div class="mode-list">
                    <button class="mode-btn" data-mode="casual">CASUAL</button>
                    <button class="mode-btn" data-mode="challenge-a">CHALLENGE A</button>
                    <button class="mode-btn" data-mode="challenge-b">CHALLENGE B</button>
                    <button class="mode-btn" data-mode="challenge-c" disabled>C · SOON</button>
                </div>
            </div>
            <div class="config-section">
                <h2 class="pixel-subtitle">PLAYERS</h2>
                <div id="players-list"></div>
                <button id="add-player-btn" class="pixel-btn">+ Add Player</button>
            </div>
            <div class="config-section">
                <h2 class="pixel-subtitle">SETTINGS</h2>
                <div class="setting-row">
                    <label>BPM</label>
                    <input type="number" id="bpm-input" value="120" min="60" max="240">
                </div>
                <div class="setting-row">
                    <label>Beats per round</label>
                    <input type="number" id="beats-per-round-input" value="4" min="2" max="16">
                </div>
                <div class="setting-row">
                    <label>Rounds</label>
                    <input type="number" id="rounds-input" value="2" min="1" max="10">
                </div>
                <div class="setting-row">
                    <label>Time per round (s)</label>
                    <input type="number" id="time-per-round-input" value="30" min="10" max="120">
                </div>
                <div class="setting-row">
                    <label>Snap grid</label>
                    <div class="grid-checks">
                        <label><input type="checkbox" class="grid-check" value="8"> 8th</label>
                        <label><input type="checkbox" class="grid-check" value="12"> 12th</label>
                        <label><input type="checkbox" class="grid-check" value="16" checked> 16th</label>
                        <label><input type="checkbox" class="grid-check" value="24"> 24th</label>
                    </div>
                </div>
                <div class="setting-row">
                    <label>Show attack notes</label>
                    <div class="grid-checks">
                        <label><input type="checkbox" id="show-attack-notes" checked> ON</label>
                    </div>
                </div>
                <div class="setting-row">
                    <label>Presets</label>
                    <div class="preset-list">
                        <button class="pixel-btn preset-btn" data-preset="visual">Visual Assist</button>
                        <button class="pixel-btn preset-btn" data-preset="audio">Audio-First</button>
                    </div>
                </div>
            </div>
            <div class="config-actions">
                <button id="start-game-btn" class="pixel-btn primary">PLAY</button>
                <button id="reset-settings-btn" class="pixel-btn danger">RESET</button>
            </div>
        </div>
    </div>

    <div id="keybind-modal" class="modal hidden">
        <div class="modal-content pixel-box">
            <h3>KEY BINDING</h3>
            <p class="hint">Press keys to bind<br>Press <kbd>ESC</kbd> to finish</p>
            <div id="keybind-display" class="keybind-display"></div>
            <p id="keybind-player-name" class="player-name"></p>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="round-info">
                <span id="round-display">Round: 1 / 2</span>
                <span id="phase-display">Attacker: P1</span>
                <span id="mode-info-display"></span>
                <span id="timer-display">30s</span>
            </div>
        </div>
        <div class="rhythm-track-area">
            <canvas id="rhythm-canvas"></canvas>
            <div class="beat-markers"></div>
        </div>
        <div id="game-players-area" class="players-area"></div>
        <div class="game-controls">
            <button id="pause-btn" class="pixel-btn">PAUSE</button>
            <button id="quit-btn" class="pixel-btn">QUIT</button>
        </div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="pixel-container">
            <h1 class="pixel-title">GAME OVER</h1>
            <div id="results-list"></div>
            <button id="restart-btn" class="pixel-btn primary">REPLAY</button>
            <button id="back-to-config-btn" class="pixel-btn">SETTINGS</button>
        </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
        <div class="pixel-box">
            <h2>PAUSED</h2>
            <p>Press <kbd>ESC</kbd> or click to resume</p>
            <button id="resume-btn" class="pixel-btn primary">RESUME</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>
</body>
</html>
